<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Roster</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header class="app-header">
        <div class="app-logo">
            <h1>Battle Roster</h1>
            <span>Menedżer rozpisek</span>
        </div>

        <div class="file-actions">
            <button id="btnOpenJson" type="button">Otwórz JSON</button>
            <button id="btnSaveJson" type="button">Zapisz JSON</button>

            <input type="file"
                   id="jsonFileInput"
                   accept=".json,application/json"
                   hidden>
        </div>
    </header>

    <div class="app-container">

        <aside class="rosters-panel">
            <div class="panel-header">
                <h2>Rozpiski</h2>
                <button id="btnAddRoster" type="button">+ Nowa</button>
            </div>

            <div id="rostersList" class="rosters-list"></div>
        </aside>

        <main class="main-content">

            <section class="roster-details">
                <div class="roster-header">
                    <div>
                        <h2 id="rosterName">Wybierz rozpiskę</h2>
                        <span id="rosterUnitCount">Brak jednostek</span>
                    </div>

                    <div class="roster-actions">
                        <button id="btnEditRoster" type="button">Edytuj nazwę</button>
                        <button id="btnDeleteRoster" type="button">Usuń rozpiskę</button>
                    </div>
                </div>

                <div class="roster-summary">
                    <div class="summary-item">
                        <span>Łączny koszt</span>
                        <strong id="rosterTotalCost">0 pkt</strong>
                    </div>

                    <div class="summary-item">
                        <span>Liczba jednostek</span>
                        <strong id="rosterTotalUnits">0</strong>
                    </div>
                </div>
            </section>

            <section class="units-section">
                <div class="section-header">
                    <h2>Jednostki</h2>
                    <button id="btnAddUnit" type="button">+ Dodaj jednostkę</button>
                </div>

                <div id="unitsList" class="units-list"></div>
            </section>

            <section class="unit-editor" id="unitEditor">

                <div class="section-header">
                    <h2 id="unitEditorTitle">Szczegóły jednostki</h2>

                    <div class="unit-actions">
                        <button id="btnEditUnit" type="button" class="btn-small">Edytuj</button>
                        <button id="btnDeleteUnit" type="button" class="btn-small">Usuń</button>
                        <button id="btnSaveUnitChanges" type="button" hidden class="btn-small">Zapisz</button>
                        <button id="btnCancelUnitChanges" type="button" hidden class="btn-small">Anuluj</button>
                    </div>
                </div>

                <div class="unit-basic-info">
                    <div class="form-group">
                        <label for="unitName" id="unitNameLabel" hidden>Nazwa jednostki</label>
                        <input type="text" id="unitName" readonly hidden>
                    </div>

                    <div class="form-group">
                        <label for="unitCost" id="unitCostLabel" hidden>Koszt</label>
                        <input type="number" id="unitCost" readonly hidden>
                    </div>
                </div>

                <div class="unit-stats">
                    <h3 id="unitStatsH3">Statystyki</h3>

                    <div class="stats-section">
                        <h4 id="unitStatsIbecneH4">Obecne</h4>

                        <div class="stats-grid">

                            <div class="stat-group">
                                <label>WW</label>
                                <input type="number" id="unitWWCurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>US</label>
                                <input type="number" id="unitUSCurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>Sz</label>
                                <input type="number" id="unitSZCurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>S</label>
                                <input type="number" id="unitSCurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>Wt</label>
                                <input type="number" id="unitWTCurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>Żw</label>
                                <input type="number" id="unitZWCurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>I</label>
                                <input type="number" id="unitICurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>A</label>
                                <input type="number" id="unitACurrent" readonly>
                            </div>

                            <div class="stat-group">
                                <label>CP</label>
                                <input type="number" id="unitCPCurrent" readonly>
                            </div>

                        </div>
                    </div>

                    <div class="stats-section" id="unitMaxStats">
                        <h4>Maksymalne</h4>

                        <div class="stats-grid">

                            <div class="stat-group">
                                <label>WW</label>
                                <input type="number" id="unitWWMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>US</label>
                                <input type="number" id="unitUSMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>Sz</label>
                                <input type="number" id="unitSZMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>S</label>
                                <input type="number" id="unitSMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>Wt</label>
                                <input type="number" id="unitWTMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>Żw</label>
                                <input type="number" id="unitZWMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>I</label>
                                <input type="number" id="unitIMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>A</label>
                                <input type="number" id="unitAMax" readonly>
                            </div>

                            <div class="stat-group">
                                <label>CP</label>
                                <input type="number" id="unitCPMax" readonly>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="unit-items">
                    <div class="section-header">
                        <h3>Przedmioty</h3>
                        <button id="btnAddItem" type="button" hidden>+ Dodaj przedmiot</button>
                    </div>

                    <div id="unitItemsList"></div>
                </div>

                <div class="unit-skills">
                    <div class="section-header">
                        <h3>Zdolności</h3>
                        <button id="btnAddSkill" type="button" hidden>+ Dodaj zdolność</button>
                    </div>

                    <div id="unitSkillsList"></div>
                </div>

            </section>

        </main>
    </div>

    <template id="unitTemplate">
        <article class="unit-card">
            <div class="unit-card-header">
                <h3 class="unit-card-name"></h3>
                <span class="unit-card-cost"></span>
            </div>

            <button type="button" class="btnSelectUnit">Szczegóły</button>
        </article>
    </template>

    <template id="itemTemplate">
        <article class="item-card">
            <div class="item-card-header">
                <h4 class="item-name"></h4>



                <div class="item-stats">
                    <div class="stat-group">
                        <label>Zasięg</label>
                        <span class="item-range"></span>
                    </div>

                    <div class="stat-group">
                        <label>Siła</label>
                        <span class="item-strength"></span>
                    </div>

                    <div class="stat-group2">
                        <label>Koszt</label>
                        <span class="item-cost"></span>
                    </div>
                </div>
            </div>

            <p class="item-description"></p>
        </article>
    </template>

    <template id="skillTemplate">
        <article class="skill-card">
            <div class="skill-card-header">
                <h4 class="skill-name"></h4>
                <span class="skill-cost"></span>
            </div>

            <p class="skill-description"></p>
        </article>
    </template>

</body>
</html>
